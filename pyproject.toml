[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seedfractal"
version = "0.1.0"
description = "Self-improving bit-packed nested-seed fractal AI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Grant Wesson"}]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
seedfractal-demo = "seedfractal.demo:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["seedfractal*"]
